<section class="home">
  @if (isEditing()) {
    <div class="card">
      <select-locale (confirm)="onChangeEditing(false)" />
    </div>
  } @else {
    <div class="card">
      <p class="home__info">Nível atual</p>
      <strong class="home__measurement">5,34 metros</strong>

      <div class="home__edit-locale">
        <p class="home__info">Centro, Harmonia - RS</p>
        <button matMiniFab (click)="onChangeEditing(true)">
          <mat-icon>edit</mat-icon>
        </button>
      </div>
    </div>

    <div class="home__last-update">
      <span>Data da última atualização: 12/02/2026 às 21:23</span>
    </div>
  }

  <div class="home__chart">
    <chart />
  </div>
</section>
