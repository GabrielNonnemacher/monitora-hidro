<section class="about">
  <h3 class="title-page">Sobre</h3>

  <div class="about__content">
    @for (card of aboutCards; track card.id) {
      <div class="card">
        <h4 class="about__item-title">{{ card.title }}</h4>
        <p class="about__item-description">{{ card.description }}</p>
      </div>
    }
  </div>
</section>
