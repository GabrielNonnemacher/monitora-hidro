<section class="news">
  <h3 class="title-page">Notícias</h3>

  <div class="container-cards">
    @for (news of news; track news.id) {
      <div class="card" target="_blank" rel="noopener noreferrer">
        <div class="news__image">
          <img [src]="news.image" alt="" srcset="" />
        </div>

        <div class="news__title">
          <h4 class="news__item-title">{{ news.title }}</h4>
        </div>

        <p class="news__item-date"><strong>Publicado:</strong> {{ news.date }}</p>

        <p class="news__item-description">{{ news.description.slice(0, 135) + '...' }}</p>

        <div class="news__actions">
          <a
            matButton="filled"
            [href]="news.link"
            target="_blank"
            rel="noopener noreferrer"
            [matTooltip]="'Acessar ' + news.link.slice(0, 30) + '...'"
            matTooltipPosition="below"
            matTooltipHideDelay="200"
          >
            <span>Acessar</span>
            <mat-icon>arrow_forward</mat-icon>
          </a>
        </div>
      </div>
    }
  </div>
</section>
