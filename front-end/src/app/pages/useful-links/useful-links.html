<section class="useful-links">
  <h3 class="title-page">Links Úteis</h3>

  <div class="container-cards">
    @for (link of links; track link.id) {
      <div class="card" target="_blank" rel="noopener noreferrer">
        <div class="useful-links__title">
          <mat-icon class="useful-links__icon">{{ link.icon }}</mat-icon>
          <h4 class="useful-links__item-title">{{ link.name }}</h4>
        </div>

        <p class="useful-links__item-description">{{ link.description }}</p>

        <div class="useful-links__actions">
          <a
            matButton="filled"
            [href]="link.url"
            target="_blank"
            rel="noopener noreferrer"
            [matTooltip]="'Acessar ' + link.url"
            matTooltipPosition="below"
            matTooltipHideDelay="200"
          >
            <span>Acessar</span>
            <mat-icon>arrow_forward</mat-icon>
          </a>
        </div>
      </div>
    }
  </div>
</section>
